    <path transform="translate(256 188) rotate(48)" d="M0 0C-21 -14 -21 -54 0 -70C21 -54 21 -14 0 0Z" fill="#1F7A3F"/>
    <path transform="translate(256 192) rotate(-54) scale(0.72)" d="M0 0C-21 -14 -21 -54 0 -70C21 -54 21 -14 0 0Z" fill="#1F7A3F"/>
