    <rect x="290" y="250" width="38" height="14" rx="7" fill="#D9CFC0"/>
    <rect x="184" y="282" width="64" height="14" rx="7" fill="#D9CFC0"/>
    <rect x="290" y="282" width="38" height="14" rx="7" fill="#D9CFC0"/>
    <rect x="184" y="324" width="52" height="16" rx="8" fill="#3CB54A"/>
    <rect x="276" y="324" width="52" height="16" rx="8" fill="#3CB54A"/>
  </g>
</svg>
